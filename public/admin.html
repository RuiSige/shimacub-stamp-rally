<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>特典受け渡し｜スタッフ用</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;max-width:480px;margin:30px auto;padding:20px;color:#17252a}input,button{box-sizing:border-box;width:100%;padding:14px;font-size:16px;margin:8px 0 18px;border-radius:8px;border:1px solid #aaa}button{background:#ed7928;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}p{line-height:1.7}.note{font-size:13px;color:#52646a}</style></head><body><h1>記念ステッカー受け渡し</h1><p class="note">スタッフ専用。参加者の画面に表示されるIDを確認してから操作してください。管理者キーは保存されません。</p><label>ADMIN_KEY<input id="key" type="password" autocomplete="off"></label><label>参加者ID<input id="id" autocomplete="off" placeholder="参加者画面のIDを貼り付け"></label><button id="redeem">ステッカーを受け渡し済みにする</button><p id="result" role="status"></p><script>document.getElementById('redeem').onclick=async()=>{const key=document.getElementById('key').value,id=document.getElementById('id').value.trim(),result=document.getElementById('result'),btn=document.getElementById('redeem');if(!key||!id){result.textContent='ADMIN_KEYと参加者IDを入力してください';return}if(!confirm('記念ステッカーを実際に渡しましたか？受け渡し済みに登録します。'))return;btn.disabled=true;try{const r=await fetch('/api/admin/redeem',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify({participant_id:id,reward_type:'three'})});const j=await r.json();result.textContent=r.ok?(j.already_redeemed?'すでに受け渡し済みです。重複登録はしていません。':'受け渡し済みに登録しました。'):(j.error||'エラーが発生しました')}catch(e){result.textContent='通信エラー：'+e.message}finally{btn.disabled=false}};</script></body></html>
